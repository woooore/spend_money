<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼마썼니 - 음성 가계부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="prevM">‹</button>
  <h1 id="monthTitle"></h1>
  <button id="nextM">›</button>
</header>
<section id="summary"></section>

<main>
  <div id="tab-calendar" class="tab active"></div>
  <div id="tab-list" class="tab"></div>
  <div id="tab-stats" class="tab"></div>
  <div id="tab-cards" class="tab"></div>
  <div id="tab-settings" class="tab"></div>
</main>

<button id="micBtn" title="음성으로 입력">🎤</button>
<button id="addBtn" title="직접 입력">＋</button>

<nav>
  <button data-tab="calendar" class="on">📅<span>달력</span></button>
  <button data-tab="list">📋<span>내역</span></button>
  <button data-tab="stats">📊<span>통계</span></button>
  <button data-tab="cards">💳<span>카드혜택</span></button>
  <button data-tab="settings">⚙️<span>설정</span></button>
</nav>

<div id="modal" class="hidden"><div id="modalBox"></div></div>
<div id="toast" class="hidden"></div>

<script src="parser.js"></script>
<script src="cards-db.js"></script>
<script src="app.js"></script>
</body>
</html>
