<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171315" media="(prefers-color-scheme: dark)">
<title>얼마썼니 - 음성 가계부</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="stylesheet" href="style.css">
<script>
  // 깜빡임 방지: 저장된 테마를 먼저 적용
  try { const t = (JSON.parse(localStorage.getItem('howSpendMoney.v1')) || {}).settings?.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header>
  <div class="hdr-nav">
    <button id="prevM" aria-label="이전 달">‹</button>
    <h1 id="monthTitle"></h1>
    <button id="nextM" aria-label="다음 달">›</button>
  </div>
  <button id="authBtn" class="auth-pill" aria-label="계정">로그인</button>
</header>
<section id="summary"></section>

<main>
  <div id="tab-calendar" class="tab active"></div>
  <div id="tab-list" class="tab"></div>
  <div id="tab-stats" class="tab"></div>
  <div id="tab-cards" class="tab"></div>
  <div id="tab-settings" class="tab"></div>
</main>

<div id="fabBar">
  <button id="micBtn" aria-label="음성으로 입력"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>음성</span></button>
  <button id="photoBtn" aria-label="영수증 사진 올리기"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg><span>영수증</span></button>
  <button id="addBtn" aria-label="직접 입력"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>직접입력</span></button>
</div>
<input type="file" id="receiptFile" accept="image/*" style="display:none">

<nav>
  <button data-tab="calendar" class="on"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>달력</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>내역</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>통계</button>
  <button data-tab="cards"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M7 15h3"/></svg>카드</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>설정</button>
</nav>

<div id="voiceSheet" class="hidden"></div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>
<div id="toast" class="hidden"></div>

<script src="parser.js"></script>
<script src="cards-db.js"></script>
<script src="app.js"></script>
</body>
</html>
